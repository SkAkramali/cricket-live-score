    post:
      tags: [Players]
      summary: Add a new player
      description: Add a new player to a team (Requires authentication)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - playerName
                - teamId
                - role
                - battingStyle
              properties:
                playerName:
                  type: string
                  example: "Virat Kumar"
                teamId:
                  type: integer
                  example: 1
                role:
                  type: string
                  enum: [batsman, bowler, all-rounder, wicket-keeper]
                  example: "batsman"
                battingStyle:
                  type: string
                  enum: [right-hand, left-hand]
                  example: "right-hand"
                bowlingStyle:
                  type: string
                  enum: [right-arm-fast, left-arm-fast, right-arm-spin, left-arm-spin, leg-spin, none]
                  example: "none"
                jersey_number:
                  type: integer
                  example: 18
      responses:
        201:
          description: Player added successfully
        400:
          description: Validation error
        401:
          description: Not authenticated

